plugins {
    id 'com.android.application'
}

// Versão: o GitHub Actions passa o número do build; no PC fica 1
def numeroBuild = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

// Chave oficial (vem dos "secrets" do GitHub; sem ela, assina com a chave de TESTE)
def arquivoChave = System.getenv('RETROWAY_KEYSTORE_PATH')
def temChave = arquivoChave != null && new File(arquivoChave).exists()

android {
    namespace 'io.github.leandrosouza36.retroway'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.leandrosouza36.retroway'
        minSdk 26
        targetSdk 35
        versionCode numeroBuild
        versionName "1.0.${numeroBuild}"
        // Endereço do site carregado pelo app
        buildConfigField 'String', 'SITE_URL', '"https://retrowayy.fwh.is/"'
        buildConfigField 'String', 'SITE_HOST', '"retrowayy.fwh.is"'
    }

    signingConfigs {
        // Chave de TESTE (pública, fica no projeto): mantém a mesma assinatura entre versões de teste
        teste {
            storeFile file('teste.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (temChave) {
            release {
                storeFile file(arquivoChave)
                storePassword System.getenv('RETROWAY_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RETROWAY_KEY_ALIAS')
                keyPassword System.getenv('RETROWAY_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig temChave ? signingConfigs.release : signingConfigs.teste
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Alinha as versões do Kotlin usadas pelas bibliotecas AndroidX (evita classes duplicadas)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
